services:
  frontend:
    image: ""
    build:
      context: ./my-cv-frontend
      dockerfile: Dockerfile
    volumes:
      - ./content.yaml:/src/data/content.yaml:ro
      - ./hugo.yaml:/src/hugo.yaml:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - HOT_RELOAD=${HOT_RELOAD:-true}
    ports:
      - "8081:80"

  backend:
    image: ""
    build:
      context: ./my-cv-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=localhost
      - EMAIL=dev@localhost
    depends_on:
      - frontend
      - backend
      - goatcounter

  goatcounter:
    ports:
      - "8082:8080"

volumes:
  caddy_data:
  caddy_config:
