[project]
name = "my_cv_backend"
version = "1.0.0"
description = "FastAPI backend for my CV website contact form"
readme = "README.md"
authors = [
    { name = "RobinNogues"}
]
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=4.0.1",
    "fastapi>=0.115.13",
    "pydantic[email]>=2.11.7",
    "slowapi>=0.1.9",
    "uvicorn>=0.34.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
    "B008",
]
