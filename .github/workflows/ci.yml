name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check modified paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'my-cv-backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'my-cv-frontend/**'
              - 'content.yaml'
              - 'hugo.yaml'
              - '.github/workflows/ci.yml'
            infra:
              - 'docker-compose*.yml'
              - 'caddy/**'
              - '.github/workflows/ci.yml'

  test-backend:
    name: Backend Tests (pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-cv-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run ruff linter
        run: uv run ruff check

      - name: Run ruff format check
        run: uv run ruff format --check

      - name: Run pytest
        run: uv run pytest -v

  test-frontend:
    name: Frontend Build (Hugo)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build frontend Docker image
        run: docker build -f my-cv-frontend/Dockerfile .

  test-infra:
    name: Infra Validation (compose)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

  ci-gate:
    name: CI Gate
    needs: [changes, test-backend, test-frontend, test-infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required CI upstream jobs failed or were cancelled."
          exit 1

      - name: CI Gate Passed
        run: echo "All required upstream jobs completed successfully or were skipped."
