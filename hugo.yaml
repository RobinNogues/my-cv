baseURL: "/"
languageCode: "en"
title: "CV Portfolio"
theme: glassmorphism
enableRobotsTXT: true

# Disable unnecessary features for a single-page site
disableKinds:
  - taxonomy
  - term
  - RSS

# Build settings
buildDrafts: false
buildFuture: false

# Minify output in production
minify:
  minifyOutput: true
