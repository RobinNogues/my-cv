services:
  frontend:
    image: ghcr.io/robinnogues/my-cv-frontend:latest
    container_name: cv_frontend
    restart: unless-stopped
    volumes:
      - ./content.yaml:/src/data/content.yaml:ro
    environment:
      - HUGO_BASEURL=https://${DOMAIN}

  backend:
    image: ghcr.io/robinnogues/my-cv-backend:latest
    container_name: cv_backend
    restart: unless-stopped
    environment:
      - EMAIL=${EMAIL}
      - EMAIL_PASS=${EMAIL_PASS}
      - DOMAIN=${DOMAIN}
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}

  caddy:
    image: caddy:alpine
    container_name: cv_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_DOMAIN=${DOMAIN}
      - CADDY_EMAIL=${EMAIL}
    depends_on:
      - frontend
      - backend
      - goatcounter

  goatcounter:
    image: arp242/goatcounter
    container_name: cv_goatcounter
    restart: unless-stopped
    volumes:
      - goatcounter_data:/home/goatcounter/goatcounter-data
    environment:
      - GOATCOUNTER_LISTEN=:8080
      - GOATCOUNTER_AUTOMIGRATE=true

volumes:
  caddy_data:
  caddy_config:
  goatcounter_data:
