{{- $site := .Site.Data.content.site -}}
<!-- Navigation -->
<nav class="navbar">
    <div class="container">
        <div class="nav-content glass">
            <a href="#" class="nav-logo">
                {{ index (split $site.name " ") 0 }}<span>.{{ index (split $site.name " ") 1 }}</span>
            </a>

            <!-- Desktop Menu -->
            <div class="nav-desktop">
                <a href="#experience" class="nav-link">Experience</a>
                <a href="#projects" class="nav-link">Projects</a>
                <a href="#skills" class="nav-link">Skills</a>
                <a href="#education" class="nav-link">Education</a>
                <a href="#certifications" class="nav-link">Certifications</a>
                <a href="#about" class="nav-link">About</a>

                <button class="theme-toggle" aria-label="Toggle Theme">
                    <i class="fas fa-sun"></i>
                    <i class="fas fa-moon"></i>
                </button>

                <a href="#contact" class="btn-contact">Contact</a>
            </div>

            <!-- Mobile Menu Button -->
            <div class="nav-mobile-btn">
                <button class="theme-toggle mobile-theme-toggle" aria-label="Toggle Theme">
                    <i class="fas fa-sun"></i>
                    <i class="fas fa-moon"></i>
                </button>
                <button id="mobile-menu-btn" class="menu-toggle-btn" aria-label="Toggle menu">
                    <i class="fas fa-bars icon-bars"></i>
                    <i class="fas fa-times icon-close"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Menu Drawer -->
        <div id="mobile-menu" class="mobile-menu glass">
            <a href="#experience" class="mobile-link">Experience</a>
            <a href="#projects" class="mobile-link">Projects</a>
            <a href="#skills" class="mobile-link">Skills</a>
            <a href="#education" class="mobile-link">Education</a>
            <a href="#certifications" class="mobile-link">Certifications</a>
            <a href="#about" class="mobile-link">About</a>
            <a href="#contact" class="mobile-link mobile-link-contact">Contact</a>
        </div>
    </div>
</nav>
