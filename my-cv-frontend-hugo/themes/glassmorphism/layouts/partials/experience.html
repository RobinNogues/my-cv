<!-- Experience Section (Timeline) -->
<section id="experience" class="scroll-mt">
    <h2 class="section-title">
        <i class="fas fa-briefcase"></i> Experience
    </h2>

    <div class="timeline">
        {{- range .Site.Data.content.experience }}
        <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-card glass">
                <div class="exp-header">
                    <div>
                        <h3 class="exp-title">{{ .title }}</h3>
                        <div class="exp-company">
                            <img src="{{ .logo | relURL }}" alt="{{ .company }}" loading="lazy">
                            {{ .company }}, {{ .location }}
                        </div>
                    </div>
                    <span class="exp-date">{{ .start_date }} - {{ .end_date }}</span>
                </div>
                <ul class="exp-list">
                    {{- range .highlights }}
                    <li>{{ . | markdownify }}</li>
                    {{- end }}
                </ul>
            </div>
        </div>
        {{- end }}
    </div>
</section>
