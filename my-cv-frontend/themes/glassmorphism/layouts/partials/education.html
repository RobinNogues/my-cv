<!-- Education -->
<section id="education" class="scroll-mt">
    <h2 class="section-title">
        {{ partial "icon.html" (dict "name" "graduation-cap") }} Education
    </h2>
    <div class="grid-2">
        {{- range .Site.Data.content.education }}
        {{- $logo := resources.Get .logo | fingerprint -}}
        <div class="edu-card glass">
            <div class="edu-header">
                <h3>{{ .degree }}</h3>
                <img src="{{ $logo.RelPermalink }}" alt="{{ .school }}" loading="lazy" width="{{ $logo.Width }}" height="{{ $logo.Height }}">
            </div>
            <p class="edu-loc">{{ .school }}, {{ .location }}</p>
            <p class="edu-year">{{ .years }}</p>
        </div>
        {{- end }}
    </div>
</section>
