<!DOCTYPE html>
<html lang="en">

<head>
    {{- partial "head.html" . -}}
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Background Decoration -->
    <div class="bg-decoration" aria-hidden="true">
        <div class="blob blob-1 animate-blob"></div>
        <div class="blob blob-2 animate-blob delay-2000"></div>
        <div class="blob blob-3 animate-blob delay-4000"></div>
    </div>

    {{- partial "navbar.html" . -}}

    <main id="main-content" class="container main-content" tabindex="-1">
        {{- block "main" . }}{{- end }}
    </main>

    {{- partial "footer.html" . -}}

    <!-- Scroll To Top -->
    <button id="back-to-top" class="back-to-top" aria-label="Back to Top">
        {{ partial "icon.html" (dict "name" "arrow-up") }}
    </button>

    {{- if not hugo.IsServer }}
    <!-- GoatCounter Analytics -->
    {{- $domain := replaceRE "^https?://" "" .Site.Data.content.site.url }}
    <script data-goatcounter="https://stats.{{ $domain }}/count" async src="https://stats.{{ $domain }}/count.js"></script>
    {{- end }}
</body>

</html>
