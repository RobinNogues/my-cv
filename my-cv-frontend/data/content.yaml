# =============================================================================
# About Me
# =============================================================================
about:
  sections:
    - title: Work Philosophy
      icon: fa-laptop-code
      text: >
        I am committed to continuous improvement, regularly reviewing my work to identify and
        implement enhancements. I have a strong drive to investigate, whether through testing
        new tools or proactively identifying bugs, finding great satisfaction in
        problem-solving. While adept at working autonomously, I highly value collaboration and
        insights from experienced colleagues. I am eager to expand my technical expertise and
        integrate new technologies into my skillset.

    - title: Music
      icon: fa-drum
      text: >
        I discovered percussion in music class at secondary school. It made me want to start
        drumming, because I was doing well compared to my classmates. I started learning drums
        with online lessons, then continued with a teacher for 3 years. I stopped taking lessons
        when I moved to another city to study, but I still practice every day. I can also play
        the cajon, a Peruvian instrument.

    - title: Sport
      icon: fa-running
      text: >
        I played club football from the age of six to seventeen. It was also at the age of 17
        that I started going to the gym with my friends. Combining the two activities was hard
        on the body, so I decided to stop playing football because bodybuilding suited me
        better. I appreciate that you can do it alone or with partners. Recently, I started
        running to complement bodybuilding with a cardio activity. I also enjoy these sports
        because I can practise them alone early in the morning, before work and without any
        constraints.

