# Projects
# =============================================================================
projects:
  - title: Gesture Recognition
    icon: fa-hand-paper
    icon_color: blue
    github: https://github.com/RobinNogues/rnn-gesture-recognition
    description: >
      Developed a hand gesture recognition system using **Mediapipe** for hand tracking
      and **TensorFlow** for gesture classification. Features a custom Python script for
      dataset creation and an **RNN model** capable of detecting letters from dynamic
      hand movements.
    tags:
      - Python
      - TensorFlow
      - Mediapipe

  - title: DeFi Platform Simulator
    icon: fa-chart-line
    icon_color: green
    github: https://github.com/RobinNogues/pydefi-simulator
    description: >
      Built a **DeFi simulator** in Python to backtest lending and borrowing strategies.
      Defines transactions and calculates key metrics (health factor, APY) using real-time crypto
      prices from **CoinGecko** and protocol data from **Aave** via **GraphQL**.
    tags:
      - Python
      - GraphQL
      - API

  - title: Portfolio Architecture
    icon: fa-globe
    icon_color: purple
    github: https://github.com/RobinNogues/my-cv
    description: >
      Designed a robust **micro-service architecture** using **Docker**.
      Features a **FastAPI** backend, **Nginx** reverse proxy for security
      and routing, automated SSL renewal, and a full CI/CD pipeline via **GitHub
      Actions** for deployment on a VPS.
    tags:
      - Docker
      - FastAPI
      - Nginx

  - title: Weather Impact in Football
    icon: fa-futbol
    icon_color: yellow
    github: null
    description: >
      Analyzed the correlation between weather (temperature, rain) and match outcomes by scraping
      historical data using **BeautifulSoup** and **Selenium**. Visualized
      statistical insights on win rates and goals using **Matplotlib**.
    tags:
      - Selenium
      - Matplotlib

